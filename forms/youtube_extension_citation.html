<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Citation</title>
    <style>
        .form-group .help-text {
            font-size: var(--cp-text-sm, 12px);
            color: var(--cp-text-secondary, #606060);
            margin-top: var(--cp-space-4, 4px);
            display: block;
        }
        .error-text {
            color: var(--cp-error, #d32f2f);
            font-size: var(--cp-text-sm, 12px);
            margin-top: var(--cp-space-4, 4px);
            display: none;
        }
        input[type="url"]:invalid + .error-text {
            display: block;
        }
    </style>
</head>
<body>
    <h2>Add a Citation</h2>
    <form id="citation-form">
        <div class="form-group">
            <label for="citationTitle">Citation Title:</label>
            <input type="text" id="citationTitle" name="citationTitle" placeholder="Enter citation title" required>
        </div>

        <div class="form-row timestamp-row">
            <div class="form-group form-group-half">
                <label for="timestampStart">Start Timestamp</label>
                <input type="text" id="timestampStart" name="timestampStart" placeholder="00:00:00" required>
            </div>
            <div class="form-group form-group-half">
                <label for="timestampEnd">End Timestamp</label>
                <input type="text" id="timestampEnd" name="timestampEnd" placeholder="––:––" required>
            </div>
        </div>
        <div class="form-row recording-row">
            <button type="button" id="form-record-start" class="record-control-btn record-start-active">Start Recording</button>
            <button type="button" id="form-record-stop" class="record-control-btn record-stop-disabled" disabled>Stop Recording</button>
        </div>

        <div class="form-group">
            <label for="source">Source URL:</label>
            <input type="url" id="source" name="source" placeholder="Enter valid URL (e.g., https://example.com)" pattern="https?://.+" title="Please enter a valid URL" required>
            <span class="help-text">Enter a valid URL to an article or YouTube video that supports this citation</span>
            <span class="error-text">Please enter a valid URL starting with http:// or https://</span>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Enter citation description..." required></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="Uncategorized">Uncategorized</option>
                <option value="Statistics & Data">Statistics &amp; Data</option>
                <option value="Quote / Misattribution">Quote / Misattribution</option>
                <option value="Historical Claim">Historical Claim</option>
                <option value="Scientific Claim">Scientific Claim</option>
                <option value="Context / Methodology">Context / Methodology</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-buttons">
            <button type="submit" id="submit-btn">Submit</button>
            <button type="button" class="cancel-btn" id="cancel-btn">Cancel</button>
        </div>
    </form>
</body>
</html>
