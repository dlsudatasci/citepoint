name: Playwright & Selenium Extension Tests
on:
  push:
    branches: [ dev, main, ci-cd ]
  pull_request:
    branches: [ dev, main, ci-cd ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install backend dependencies
      run: npm ci --prefix backend

    - name: Install Playwright Browsers and System Dependencies
      run: npx playwright install --with-deps

    - name: Install Geckodriver (For Firefox Selenium)
      run: npm install -g geckodriver

    - name: Check Firefox and Geckodriver versions
      run: |
        firefox --version
        geckodriver --version

    - name: Start backend for Selenium
      run: |
        cd backend
        MONGODB_URI=mongodb://localhost:27017/citepoint_test PORT=3000 npm start &
        echo "Backend PID: $!"
        sleep 5

    - name: Prepare clean extension for Firefox
      run: |
        mkdir -p /tmp/citepoint-ext
        cp manifest.json /tmp/citepoint-ext/
        cp -r lib /tmp/citepoint-ext/
        cp -r background /tmp/citepoint-ext/
        cp -r content /tmp/citepoint-ext/
        cp -r popup /tmp/citepoint-ext/
        cp -r forms /tmp/citepoint-ext/
        cp -r styles /tmp/citepoint-ext/
        cp -r icons /tmp/citepoint-ext/
        cp -r utils /tmp/citepoint-ext/
        echo "Extension files:"
        ls /tmp/citepoint-ext/

    - name: Run Selenium tests (Firefox)
      run: xvfb-run --auto-servernum -- node selenium/firefox.test.js
      env:
        MONGODB_URI: mongodb://localhost:27017/citepoint_test
        FIREFOX_EXT_DIR: /tmp/citepoint-ext

    - name: Run Playwright tests (Chrome)
      run: xvfb-run --auto-servernum -- npx playwright test
      env:
        MONGODB_URI: mongodb://localhost:27017/citepoint_test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30