name: Playwright Tests
on:
  push:
    branches: [ dev, main, ci-cd ]
  pull_request:
    branches: [ dev, main, ci-cd ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install backend dependencies
      run: npm ci --prefix backend

    - name: Install Playwright Browsers and System Dependencies
      run: npx playwright install --with-deps

    - name: Install Geckodriver (For Firefox Selenium)
      run: npm install -g geckodriver

    - name: Run Playwright tests (Chrome)
      run: xvfb-run --auto-servernum -- npx playwright test
      env:
        MONGODB_URI: mongodb://localhost:27017/citepoint_test
        PORT: 3000
        ALLOWED_ORIGINS: chrome-extension://
        CI: true

    - name: Run Selenium tests (Firefox)
      run: xvfb-run --auto-servernum -- node selenium/firefox.test.js

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30