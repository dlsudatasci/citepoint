name: Playwright & Selenium Extension Tests
on:
  push:
    branches: [ dev, main, ci-cd ]
  pull_request:
    branches: [ dev, main, ci-cd ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install backend dependencies
      run: npm ci --prefix backend

    - name: Install Playwright Browsers and System Dependencies
      run: npx playwright install --with-deps

    - name: Install Geckodriver (For Firefox Selenium)
      run: npm install -g geckodriver

    - name: Start backend for Selenium
      run: |
        cd backend
        MONGODB_URI=mongodb://localhost:27017/citepoint_test PORT=3000 npm start &
        echo "Backend PID: $!"
        sleep 5

    - name: Debug Firefox YouTube load
      run: |
        xvfb-run --auto-servernum -- node -e "
          const { Builder } = require('selenium-webdriver');
          const firefox = require('selenium-webdriver/firefox');
          (async () => {
            const driver = await new Builder().forBrowser('firefox').build();
            await driver.installAddon(process.cwd(), true);
            await driver.get('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
            await driver.sleep(15000);
            const title = await driver.getTitle();
            console.log('Title:', title);
            const secondary = await driver.executeScript(() => {
              return document.querySelector('#secondary')?.tagName || 'NOT FOUND';
            });
            console.log('#secondary:', secondary);
            const flexy = await driver.executeScript(() => {
              return document.querySelector('ytd-watch-flexy')?.tagName || 'NOT FOUND';
            });
            console.log('ytd-watch-flexy:', flexy);
            const panel = await driver.executeScript(() => {
              return document.querySelector('#citation-controls')?.tagName || 'NOT FOUND';
            });
            console.log('#citation-controls:', panel);
            const errors = await driver.executeScript(() => {
              return window._extensionErrors || 'no errors captured';
            });
            console.log('Extension errors:', errors);
            await driver.quit();
          })().catch(e => { console.error(e.message); process.exit(0); });
        "

    - name: Run Selenium tests (Firefox)
      run: xvfb-run --auto-servernum -- node selenium/firefox.test.js
      env:
        MONGODB_URI: mongodb://localhost:27017/citepoint_test

    - name: Run Playwright tests (Chrome)
      run: xvfb-run --auto-servernum -- npx playwright test
      env:
        MONGODB_URI: mongodb://localhost:27017/citepoint_test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30