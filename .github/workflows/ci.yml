name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:

  # ── 1. Backend: lint + API tests against a real MongoDB ──────────────────
  backend:
    name: Backend tests (Node + MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/citepoint_test
      PORT: 3000
      ALLOWED_ORIGINS: chrome-extension://test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # If you add a test script to backend/package.json later,
      # replace this step with: npm test
      - name: Smoke-test server starts and /health responds
        working-directory: backend
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:3000/health
          kill $SERVER_PID

      - name: Smoke-test citations API (POST + GET + DELETE)
        working-directory: backend
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3

          VIDEO_ID="dQw4w9WgXcQ"
          BASE="http://localhost:3000/api"

          # POST a citation
          RESP=$(curl -s -X POST "$BASE/citations/$VIDEO_ID" \
            -H "Content-Type: application/json" \
            -d '{"citationTitle":"Test Citation","username":"ci-bot","timestamp":42}')
          echo "POST response: $RESP"
          echo "$RESP" | grep -q '"success":true'

          # GET citations for that video
          GET_RESP=$(curl -s "$BASE/citations/$VIDEO_ID")
          echo "GET response: $GET_RESP"
          echo "$GET_RESP" | grep -q '"success":true'

          kill $SERVER_PID


  # ── 2. Extension: validate manifest + static checks ──────────────────────
  extension-lint:
    name: Extension static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Check required extension files exist
        run: |
          FILES=(
            "manifest.json"
            "background/background.js"
            "content/content.js"
            "content/api.js"
            "content/panel.js"
            "content/player.js"
            "content/citations.js"
            "content/voting.js"
            "content/forms.js"
            "content/recording.js"
            "content/report.js"
            "content/username.js"
            "utils/utils.js"
            "lib/browser-polyfill.js"
            "styles/extension.css"
            "popup/popup.html"
            "popup/popup.js"
            "icons/icon16.png"
            "icons/icon48.png"
          )
          MISSING=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then exit 1; fi
          echo "All required files present."

      - name: Check content scripts are listed in manifest
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8'));
            const scripts = m.content_scripts.flatMap(cs => cs.js);
            console.log('Content scripts in manifest:', scripts.join(', '));
            scripts.forEach(s => {
              const fs = require('fs');
              if (!fs.existsSync(s)) throw new Error('Missing file referenced in manifest: ' + s);
            });
            console.log('All manifest content scripts present on disk.');
          "

      - name: Check no hardcoded localhost URLs in extension code
        run: |
          # Config should come from config/config.js, not be scattered in content scripts
          HITS=$(grep -rn "localhost:3000" content/ background/ popup/ utils/ --include="*.js" || true)
          if [ -n "$HITS" ]; then
            echo "WARNING: hardcoded localhost URLs found (use config/config.js instead):"
            echo "$HITS"
            # Not a hard failure yet — warn only
          else
            echo "No hardcoded localhost URLs in extension source."
          fi


  # ── 3. Build: package the extension as a zip artifact ────────────────────
  build:
    name: Package extension zip
    runs-on: ubuntu-latest
    needs: [backend, extension-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Build Chrome zip
        run: |
          zip -r citepoint-chrome.zip . \
            -x "*.git*" \
            -x "backend/*" \
            -x "node_modules/*" \
            -x "*.bat" \
            -x "config-setup.example.html"

      # Firefox uses the same source (Manifest V3 + browser-polyfill)
      # so the same zip works — just rename it for clarity
      - name: Copy as Firefox zip
        run: cp citepoint-chrome.zip citepoint-firefox.zip

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: citepoint-chrome-${{ github.sha }}
          path: citepoint-chrome.zip
          retention-days: 14

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: citepoint-firefox-${{ github.sha }}
          path: citepoint-firefox.zip
          retention-days: 14
